name: Pomly
options:
  bundleIdPrefix: com.purvt
  deploymentTarget: { iOS: "26.0", macOS: "26.0", watchOS: "26.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Pomly:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Pomly, Shared]
    dependencies:
      - target: PomlyWidgets
        destinationFilters: [iOS]
      - target: PomlyWatch # embedded, as the App Store requires for a companion Watch app
        destinationFilters: [iOS]
      - target: PomlySafari # Safari Web Extension, same files as the Chromium one
        destinationFilters: [macOS]
    entitlements:
      path: Pomly/Pomly.entitlements
      properties:
        com.apple.security.application-groups: [group.com.purvt.pomly]
    info:
      path: Pomly/Info.plist
      properties:
        CFBundleDisplayName: Pomly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Purv Taparia
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio] # ambient sound keeps playing with the screen locked
        NSAlarmKitUsageDescription: Pomly rings when a focus session or break ends, even in Silent mode.
        NSRemindersFullAccessUsageDescription: Pomly imports reminders as tasks and completes them when you mark a task done.
        NSCalendarsFullAccessUsageDescription: Pomly finds free time in your day and adds finished focus sessions to a Pomly calendar.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.pomly
        TARGETED_DEVICE_FAMILY: "1,2"
        MAC_ENTITLEMENTS: Pomly/PomlyMac.entitlements # scripts/release.sh swaps in PomlyMacDirect for GitHub builds
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(MAC_ENTITLEMENTS) # Mac App Store sandbox + network; no App Group to provision
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-" # sign to run locally (free account)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES # needed to notarize later
  PomlyWidgets:
    type: app-extension
    platform: iOS
    sources: [PomlyWidgets, Shared, Pomly/Resources/PrivacyInfo.xcprivacy]
    entitlements:
      path: PomlyWidgets/PomlyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.purvt.pomly]
    info:
      path: PomlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pomly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.pomly.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
  PomlySafari:
    type: app-extension
    platform: macOS
    sources:
      - PomlySafari
      - path: extension # the browser extension itself, shared with Chromium (not copied)
        excludes: [test.mjs, icons, "icons/**"]
        buildPhase: resources
      - path: extension/icons
        type: folder
        buildPhase: resources
    info:
      path: PomlySafari/Info.plist
      properties:
        CFBundleDisplayName: Pomly Focus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 Purv Taparia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.pomly.safari
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_IDENTITY: "-" # sign to run locally (free account)
  PomlyWatch:
    type: application
    platform: watchOS
    sources: [PomlyWatch, Shared, Pomly/Resources/PrivacyInfo.xcprivacy]
    dependencies:
      - target: PomlyWatchWidgets
    entitlements:
      path: PomlyWatch/PomlyWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.purvt.pomly]
    info:
      path: PomlyWatch/Info.plist
      properties:
        CFBundleDisplayName: Pomly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Purv Taparia
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.purvt.pomly
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.pomly.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PomlyWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [PomlyWatchWidgets, Shared, Pomly/Resources/PrivacyInfo.xcprivacy]
    entitlements:
      path: PomlyWatchWidgets/PomlyWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.purvt.pomly]
    info:
      path: PomlyWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pomly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.pomly.watchkitapp.widgets
  PomlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PomlyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pomly
schemes:
  Pomly:
    build:
      targets: { Pomly: all }
    test:
      targets: [PomlyTests]
  PomlyWatch:
    build:
      targets: { PomlyWatch: all }
