<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stay Focused · Pomly</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="ui.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:16px;text-align:center}
main{max-width:420px;animation:in .6s cubic-bezier(.2,.75,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.dial{position:relative;width:220px;height:220px;margin:0 auto 28px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:10;stroke-linecap:round}
.dial .track{stroke:var(--line)}
.dial .fill{stroke:var(--tint);transition:stroke-dashoffset 1s linear}
.dial .big{position:absolute;inset:0;display:grid;place-items:center}
h1{font-size:28px;margin-bottom:8px}
p{margin-bottom:24px}
.acts{display:flex;flex-direction:column;align-items:center;gap:8px}
.link{background:none;color:var(--soft);font-weight:500}
form{margin-top:16px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
form input{width:110px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);text-align:center;font-size:18px}
.sec{background:transparent;border:1px solid var(--line)}
</style>
<body>
<main>
  <div class="dial" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="fill" id="fill" cx="50" cy="50" r="44" pathLength="1" stroke-dasharray="1"/></svg><div class="big" id="clock"></div></div>
  <h1>Stay Focused</h1>
  <p class="mute" id="msg" role="timer"></p>
  <div class="acts"><button class="pri" id="back">Go Back</button><button class="link" id="open">Open Anyway</button></div>
  <form id="quiz" hidden><label for="ans" id="q"></label><input id="ans" inputmode="numeric" autocomplete="off"><button class="sec">Open</button><p class="mute" id="hint" role="alert" style="width:100%;margin:0;font-size:14px"></p></form>
</main>
<script defer src="shared.js"></script><script defer src="blocked.js"></script>
