<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomly</title>
<link rel="stylesheet" href="ui.css">
<style>
body{width:340px;padding:18px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header img{width:28px;height:28px;border-radius:7px}
header h1{font-size:17px;flex:1}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--soft)}
.pill.on{background:var(--tint);color:var(--on);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.timer{text-align:center}
.timer .acts{display:flex;gap:8px;justify-content:center;margin-top:12px}
h2{font-size:13px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.code{width:100%;text-align:center;font:600 26px ui-monospace,Menlo,monospace;letter-spacing:6px;padding:10px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-transform:uppercase}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.switch{appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.2,.75,.2,1)}
.switch:checked{background:var(--tint)}.switch:checked::after{transform:translateX(20px)}
ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
li{display:flex;align-items:center;gap:2px;padding-left:12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
li button{min-height:32px;min-width:32px;padding:0;background:none;color:var(--soft);font-size:18px;line-height:1}
form{display:flex;gap:6px}
form input{flex:1;min-width:0;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
form button{padding:0 16px}
footer{text-align:center}
</style>
<body>
<header><img src="icons/48.png" alt=""><h1>Pomly</h1><span class="pill" id="pill" aria-live="polite"></span></header>

<section id="unpaired" hidden>
  <div class="card">
    <h2>Pair With Pomly</h2>
    <p class="mute" style="margin-bottom:12px">In Pomly on your iPhone, iPad or Mac, open Settings › Sync Devices, then type the code here.</p>
    <input class="code" id="code" maxlength="6" autocomplete="off" spellcheck="false" aria-label="Pairing code" placeholder="POMLY0">
    <p class="err" id="err" role="alert"></p>
  </div>
</section>

<section id="paired" hidden>
  <div class="card timer">
    <h2 id="phase">Focus</h2>
    <div class="big" id="clock" role="timer" aria-live="off">25:00</div>
    <p class="mute" id="state"></p>
    <div class="acts"><button class="pri" id="main"></button><button class="sec" id="stop">Stop</button></div>
  </div>
  <div class="card">
    <label class="row"><span><b>Block Distracting Sites</b><br><span class="mute" style="font-size:13px">During focus sessions, paused included.</span></span>
      <input type="checkbox" class="switch" id="enabled" role="switch"></label>
    <label class="row"><span><b>Puzzle Before Opening</b><br><span class="mute" style="font-size:13px">Opening a blocked site anyway unblocks it for 5 minutes.</span></span>
      <input type="checkbox" class="switch" id="puzzle" role="switch"></label>
    <ul id="sites" aria-label="Blocked sites"></ul>
    <form id="add"><input id="site" placeholder="Add a Site, Like news.com" aria-label="Add a site" autocomplete="off" spellcheck="false"><button class="sec">Add</button></form>
    <p class="err" id="siteErr" role="alert"></p>
  </div>
  <footer><button class="link" id="leave">Unpair This Browser</button></footer>
</section>
<script defer src="shared.js"></script><script defer src="popup.js"></script>
